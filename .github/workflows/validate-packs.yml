name: Validate content packs

on:
  push:
    paths:
      - "public/packs/**"
      - "tools/validate.js"
      - "tools/validate-all.js"
      - ".github/workflows/validate-packs.yml"
  pull_request:
    paths:
      - "public/packs/**"
      - "tools/validate.js"
      - "tools/validate-all.js"
      - ".github/workflows/validate-packs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Validation is catalog-driven: validate-all.js reads
      # public/packs/catalog.json and validates every listed pack. Strictness
      # comes from each manifest's "released" field (released → missing days are
      # errors), so adding a pack never touches this workflow.
      - run: node tools/validate-all.js
